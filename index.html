<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Explorer Quest!</title>
  <!-- Playful, rounded Google Font for kids -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Background Decorative Elements -->
  <div class="bg-circles">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
  </div>

  <div class="game-container">
    
    <!-- 1. START SCREEN -->
    <div id="start-screen" class="screen active">
      <div class="logo-area">
        <h1 class="bounce-title">Math Explorer!</h1>
        <p class="subtitle">Fun Addition & Subtraction Quest</p>
      </div>

      <!-- Mascot Container in Menu -->
      <div class="mascot-container status-idle" id="menu-mascot">
        <!-- SVG Mascot: Mathy -->
        <svg class="mascot-svg" viewBox="0 0 200 200" width="160" height="160">
          <defs>
            <!-- Body gradient -->
            <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a78bfa" />
              <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>
            <!-- Belly gradient -->
            <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ede9fe" />
              <stop offset="100%" stop-color="#ddd6fe" />
            </linearGradient>
          </defs>
          
          <!-- Cute Horns/Antennae -->
          <path class="mascot-horn-l" d="M 55,52 Q 35,15 55,30 Z" fill="#8b5cf6" stroke="#4c1d95" stroke-width="4" stroke-linejoin="round"/>
          <path class="mascot-horn-r" d="M 145,52 Q 165,15 145,30 Z" fill="#8b5cf6" stroke="#4c1d95" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="48" cy="18" r="6" fill="#f43f5e" />
          <circle cx="152" cy="18" r="6" fill="#f43f5e" />

          <!-- Main Jelly Body -->
          <rect x="40" y="45" width="120" height="120" rx="50" ry="45" fill="url(#bodyGrad)" stroke="#4c1d95" stroke-width="6"/>

          <!-- Soft Belly -->
          <ellipse cx="100" cy="125" rx="35" ry="25" fill="url(#bellyGrad)"/>

          <!-- Blushing Cheeks -->
          <ellipse class="cheek-l" cx="62" cy="106" rx="9" ry="6" fill="#f43f5e" opacity="0.6"/>
          <ellipse class="cheek-r" cx="138" cy="106" rx="9" ry="6" fill="#f43f5e" opacity="0.6"/>

          <!-- Eyes -->
          <g class="eyes-group">
            <!-- Left Eye - Normal -->
            <circle class="eye-bg-l" cx="75" cy="90" r="16" fill="white" stroke="#4c1d95" stroke-width="3"/>
            <circle class="pupil-l" cx="79" cy="88" r="7" fill="#1e1b4b"/>
            <circle class="pupil-glint-l" cx="82" cy="85" r="2.5" fill="white"/>

            <!-- Right Eye - Normal -->
            <circle class="eye-bg-r" cx="125" cy="90" r="16" fill="white" stroke="#4c1d95" stroke-width="3"/>
            <circle class="pupil-r" cx="121" cy="88" r="7" fill="#1e1b4b"/>
            <circle class="pupil-glint-r" cx="118" cy="85" r="2.5" fill="white"/>

            <!-- Left Eye - Happy -->
            <path class="eye-happy-l" d="M 60,94 Q 75,76 90,94" fill="none" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round"/>
            <!-- Right Eye - Happy -->
            <path class="eye-happy-r" d="M 110,94 Q 125,76 140,94" fill="none" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round"/>

            <!-- Left Eye - Sad/Confused -->
            <path class="eye-sad-l" d="M 63,84 L 83,96 M 63,96 L 83,84" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round"/>
            <!-- Right Eye - Sad/Confused -->
            <path class="eye-sad-r" d="M 117,84 L 137,96 M 117,96 L 137,84" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- Mouths -->
          <g class="mouth-group">
            <!-- Normal Smile -->
            <path class="mouth-smile" d="M 88,110 Q 100,126 112,110" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round"/>
            
            <!-- Happy Open Mouth -->
            <path class="mouth-happy" d="M 86,110 Q 100,136 114,110 Z" fill="#881337" stroke="#1e1b4b" stroke-width="4" stroke-linejoin="round"/>
            <path class="mouth-tongue" d="M 92,121 Q 100,132 108,121 Z" fill="#f43f5e" />

            <!-- Shocked/Thinking Mouth -->
            <circle class="mouth-shocked" cx="100" cy="116" r="8" fill="#1e1b4b"/>

            <!-- Sad/Frown Mouth -->
            <path class="mouth-sad" d="M 88,120 Q 100,106 112,120" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- Cute Little Feet -->
          <ellipse cx="65" cy="165" rx="16" ry="10" fill="#7c3aed" stroke="#4c1d95" stroke-width="4"/>
          <ellipse cx="135" cy="165" rx="16" ry="10" fill="#7c3aed" stroke="#4c1d95" stroke-width="4"/>
        </svg>
      </div>

      <div class="difficulty-panel">
        <p class="section-title">Choose Your Level:</p>
        <div class="difficulty-options">
          <button class="diff-btn easy active" data-level="easy">
            <span class="btn-stars">⭐</span>
            <span class="btn-text">Easy</span>
            <span class="btn-desc">Numbers 1 - 10</span>
          </button>
          <button class="diff-btn medium" data-level="medium">
            <span class="btn-stars">⭐⭐</span>
            <span class="btn-text">Medium</span>
            <span class="btn-desc">Numbers 1 - 20</span>
          </button>
          <button class="diff-btn hard" data-level="hard">
            <span class="btn-stars">⭐⭐⭐</span>
            <span class="btn-text">Hard</span>
            <span class="btn-desc">Numbers 1 - 50</span>
          </button>
        </div>
      </div>

      <button id="start-game-btn" class="main-play-btn">Let's Play! 🚀</button>
    </div>

    <!-- 2. GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
      
      <!-- Top Status Header -->
      <div class="game-header">
        <button id="back-to-menu-btn" class="icon-btn" title="Back to Menu">🏠</button>
        
        <!-- Score Bubble -->
        <div class="score-bubble">
          <span class="score-icon">⭐</span>
          <span class="score-label">Score:</span>
          <span id="score-val" class="score-number">0</span>
        </div>
      </div>

      <!-- Round Progress Indicator -->
      <div class="progress-container">
        <div class="progress-header">
          <span class="progress-text">Question <span id="current-q-num">1</span> of 10</span>
        </div>
        <div class="progress-bar-track">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Mascot & Speech Bubble Area -->
      <div class="mascot-speech-container">
        <div class="mascot-container status-idle" id="game-mascot">
          <!-- Reusable SVG clone (will render via JS or copy from above) -->
        </div>
        <div class="speech-bubble">
          <p id="mascot-speech-text">Let's do some math together! Tap the correct answer below.</p>
        </div>
      </div>

      <!-- The Math Question Card -->
      <div class="question-card" id="question-card">
        <div class="question-text" id="math-problem">5 + 3 = ?</div>
      </div>

      <!-- Answer Options Grid -->
      <div class="options-container">
        <div class="options-grid" id="options-grid">
          <!-- Dynamically populated via JS -->
          <button class="option-btn">4</button>
          <button class="option-btn">8</button>
          <button class="option-btn">10</button>
          <button class="option-btn">6</button>
        </div>
      </div>

    </div>

    <!-- 3. CELEBRATION SCREEN -->
    <div id="celebration-screen" class="screen">
      <div class="celebration-card">
        <h2 class="congrats-title">Fantastic! 🎉</h2>
        <p class="congrats-subtitle">You finished the math quest!</p>

        <!-- Stars Rating Animation -->
        <div class="stars-rating-container" id="stars-container">
          <div class="star-rating" id="star-1">⭐</div>
          <div class="star-rating" id="star-2">⭐</div>
          <div class="star-rating" id="star-3">⭐</div>
        </div>

        <!-- Performance Summary Card -->
        <div class="performance-summary">
          <div class="summary-row">
            <span class="summary-label">Final Score:</span>
            <span id="final-score-val" class="summary-val">10 / 10</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Accuracy:</span>
            <span id="accuracy-val" class="summary-val">100%</span>
          </div>
          <p class="summary-motivate" id="summary-motivate-msg">Wow, you are a Math Champion!</p>
        </div>

        <!-- Action Buttons -->
        <div class="celebration-actions">
          <button id="replay-btn" class="action-btn primary">Play Again! 🔄</button>
          <button id="menu-btn" class="action-btn secondary">Main Menu 🏠</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Overlay Canvas for Confetti Animations -->
  <canvas id="confetti-canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
